services:
  - type: web
    name: andry-lms
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # ── Stripe (opcional en modo simulación) ──
      # Mientras ENABLE_SIMULATED_CHECKOUT=true los pagos no tocan
      # Stripe y estas 5 vars pueden quedar vacías en Render.
      # Cuando se active Stripe live, pegar aquí los valores reales.
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_BASIC
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false
      # ── Payments mode ──
      # Borrar esta línea (o poner "false") cuando Stripe live esté listo.
      - key: ENABLE_SIMULATED_CHECKOUT
        value: "true"
      - key: AI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
